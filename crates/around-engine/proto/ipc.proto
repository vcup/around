syntax = "proto3";
package around.ipc;

enum Status {
  STATUS_OK = 0;
  STATUS_ERROR = 1;
}

enum PlaybackStatus {
  PLAYING = 0;
  PAUSED = 1;
  STOPPED = 2;
  BUFFERING = 3;
  ERROR = 4;
}

enum CodecSource {
  BUILTIN = 0;
  EXTENSION = 1;
  DYNAMIC = 2;
}

// Length-delimited framing: each message is prefixed with a varint length.
// Wire format: [varint_length][serialized_message]

message IpcCommand {
  oneof command {
    PlayCommand play = 1;
    PauseCommand pause = 2;
    ResumeCommand resume = 3;
    SeekCommand seek = 4;
    StopCommand stop = 5;
    StatusCommand status = 6;
    ListCodecsCommand list_codecs = 7;
    LoadCodecCommand load_codec = 8;
    LoadCodecBytesCommand load_codec_bytes = 9;
    CleanupCommand cleanup = 10;
    ShutdownCommand shutdown = 11;
  }
}

message PlayCommand { string path = 1; optional uint64 stream_id = 12; }
message PauseCommand { optional uint64 stream_id = 12; }
message ResumeCommand { optional uint64 stream_id = 12; }
message SeekCommand { uint64 position_ms = 1; optional uint64 stream_id = 12; }
message StopCommand { optional uint64 stream_id = 12; }
message StatusCommand { optional uint64 stream_id = 12; }
message ListCodecsCommand {}
message LoadCodecCommand { string path = 1; }
message ShutdownCommand {}
message LoadCodecBytesCommand { bytes data = 1; string name = 2; }
message CleanupCommand {}

message StreamStatus {
  uint64 stream_id = 1;
  PlaybackStatus status = 2;
  uint64 position_ms = 3;
  bool seekable = 4;
  bool device_lost = 5;
  optional TrackInfo track = 6;
}

message IpcResponse {
  Status status = 1;
  optional PlaybackStatus state = 2;
  optional uint64 position_ms = 3;
  optional string code = 4;    // error code when status="error"
  optional string message = 5;
  optional uint64 track_id = 6;
  optional TrackInfo track = 7;
  repeated CodecDescriptor codecs = 8;
  optional bool device_lost = 9;
  repeated string removed_files = 10;
  optional uint64 stream_id = 11;
  optional bool seekable = 12;
  repeated StreamStatus streams = 13;
}

message TrackInfo {
  uint64 id = 1;
  string path = 2;
  string format = 3;
  uint64 duration_ms = 4;
}

message CodecDescriptor {
  string name = 1;
  repeated string formats = 2;
  CodecSource source = 3;
  optional string path = 4;
}
