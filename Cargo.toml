[workspace]
members = [
    "crates/around-core",
    "crates/around-engine",
    "crates/around-cli",
    "crates/around-codec-wav",
    "crates/around-codec-test-pcm",
    "crates/around-codec-macros",
    "crates/around-source-file",
    "examples/simple_decoder",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["vcup"]
repository = "https://github.com/vcup/around"
license-file = "LICENSE"

[workspace.dependencies]
around-core = { path = "crates/around-core" }
around-engine = { path = "crates/around-engine" }
around-source-file = { path = "crates/around-source-file" }
around-codec-wav = { path = "crates/around-codec-wav" }
around-codec-test-pcm = { path = "crates/around-codec-test-pcm" }
around-codec-macros = { path = "crates/around-codec-macros" }

bitflags = "2"
clap = { version = "4", features = ["derive"] }
tokio = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ctrlc = "3"
symphonia = { version = "0.5", default-features = false }
kdl = "6"
cpal = "0.15"
libloading = "0.8"
serde = "1"
base64 = "0.22"
criterion = { version = "0.5", features = ["html_reports"] }
crossbeam = "0.8"
prost = "0.14"
prost-build = "0.14"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = true

[profile.ci]
inherits = "dev"
strip = false
debug = false
