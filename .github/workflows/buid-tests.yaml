name: Build and tests

on:
   push:
      branches: ["master"]
   pull_request:
      branches: ["master"]

env:
   CARGO_TERM_COLOR: always

jobs:
   # ── Linux (primary dev target) ──────────────────────────────────────────
   linux:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              components: clippy, rustfmt

         - name: Install ALSA dev libraries
           run: sudo apt-get update && sudo apt-get install -y libasound2-dev

         - name: Build
           run: cargo build --workspace --verbose

         - name: Test
           run: cargo test --workspace --verbose
           env:
              ALSA_CONFIG_PATH: ${{ github.workspace }}/ci/alsa-null.conf

         - name: Clippy
           run: cargo clippy --workspace -- -D warnings 2>&1 | head -80

   # ── macOS ───────────────────────────────────────────────────────────────
   macos:
      runs-on: macos-latest
      steps:
         - uses: actions/checkout@v4
         - uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              components: clippy

         - name: Build
           run: cargo build --workspace --verbose

         - name: Test
           run: cargo test --workspace --verbose
           # Audio tests skip automatically if no output device is available.

         - name: Clippy
           run: cargo clippy --workspace -- -D warnings 2>&1 | head -80

   # ── Windows ─────────────────────────────────────────────────────────────
   windows:
      runs-on: windows-latest
      steps:
         - uses: actions/checkout@v4
         - uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              components: clippy

         - name: Build
           run: cargo build --workspace --verbose

         - name: Test
           run: cargo test --workspace --verbose
           # Audio tests skip automatically if no output device is available.
           # IPC tests use TCP transport on Windows (no Unix sockets).
           # Named pipe tests require #[cfg(windows)] gating.

         - name: Clippy
           run: cargo clippy --workspace -- -D warnings 2>&1 | head -80
